# Drives real inference load at vLLM so the dashboards show the GPU doing actual work.
# Run it after vLLM is Ready; the contrast between this (engines active) and steady
# state (model resident, engines idle -> GPUAllocatedButIdle fires) is the whole story.
#
#   kubectl apply -f manifests/loadgen/loadgen-job.yaml
#   kubectl -n workloads logs -f job/vllm-loadgen
apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-loadgen
  namespace: workloads
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: loadgen
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "driving load against vllm for ~4 minutes..."
              end=$(( $(date +%s) + 240 ))
              i=0
              while [ "$(date +%s)" -lt "$end" ]; do
                curl -s http://vllm.workloads.svc.cluster.local:8000/v1/completions \
                  -H 'Content-Type: application/json' \
                  -d '{"model":"facebook/opt-1.3b","prompt":"Explain Kubernetes to an SRE in two sentences.","max_tokens":128,"temperature":0.7}' \
                  -o /dev/null -w "req %{http_code} %{time_total}s\n"
                i=$((i+1))
              done
              echo "done, $i requests"
